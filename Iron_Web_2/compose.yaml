name: iron-web-2

services:
  falkordb:
    image: falkordb/falkordb:v4.20.7
    container_name: iron-web-2-falkordb
    ports:
      - "127.0.0.1:6380:6379"
    environment:
      FALKORDB_DATA_PATH: /data
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
      BROWSER: "0"
    volumes:
      - ./data/falkordb:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
