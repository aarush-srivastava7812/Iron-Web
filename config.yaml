# Hybrid Long-Term AI Memory Configuration
# Copy to config.yaml and modify as needed

# =============================================================================
# GPU Configuration (RTX 4050 6GB VRAM Profile)
# =============================================================================
# Hardware: NVIDIA GeForce RTX 4050 Laptop GPU (6GB VRAM)
# Constraint: 1GB VRAM buffer reserved for system/display -> max allowed: 5.0GB
USE_GPU: true

gpu:
  enabled: true
  device: "cuda:0"
  total_vram_gb: 6.0
  reserved_buffer_gb: 1.0     # 1GB safety buffer for display/OS
  max_allowed_vram_gb: 5.0    # Hard operational ceiling
  fallback_to_cpu: true

# =============================================================================
# Qdrant Vector Store
# =============================================================================
qdrant:
  # Local mode (embedded) - no server needed
  path: "./data/qdrant"
  # For remote: url: "http://localhost:6333"
  # api_key: ""  # If using cloud
  
  # Collection settings
  collection_name: "semantic_memory"
  vector_size: 384  # bge-small-en-v1.5
  distance: "Cosine"
  
  # HNSW Index (optimized for speed)
  hnsw:
    m: 16
    ef_construct: 100
    ef_search: 64
  
  # Quantization (4x memory savings, <2% recall loss)
  quantization:
    type: "int8"  # "int8" | "binary" | "none"
    always_ram: true

# =============================================================================
# Kuzu Graph Store (Embedded)
# =============================================================================
kuzu:
  path: "./data/kuzu"
  
  # Schema versioning
  schema_version: 1

# =============================================================================
# Embeddings (FastEmbed / ONNX)
# =============================================================================
embeddings:
  model: "BAAI/bge-small-en-v1.5"  # 384-dim, fast, good quality
  # Alternative models:
  # "sentence-transformers/all-MiniLM-L6-v2"  # 384-dim, faster
  # "BAAI/bge-base-en-v1.5"  # 768-dim, better quality
  # "BAAI/bge-large-en-v1.5"  # 1024-dim, best quality
  
  # Quantization
  quantize: true  # Use INT8 quantization (minimal VRAM footprint)
  providers: ["CUDAExecutionProvider", "CPUExecutionProvider"]
  
  # Batch settings (conservative for 6GB VRAM, leaves >1GB buffer)
  batch_size: 32
  max_length: 512

# =============================================================================
# Reranker (Cross-Encoder)
# =============================================================================
reranker:
  model: "BAAI/bge-reranker-base"  # ~280MB, ~1.2GB VRAM loaded
  # Alternative: "BAAI/bge-reranker-large" (better quality, slower)
  # Alternative: "cross-encoder/ms-marco-MiniLM-L-6-v2" (faster)
  
  providers: ["CUDAExecutionProvider", "CPUExecutionProvider"]
  batch_size: 16  # Conservative batch size to maintain 1GB VRAM safety buffer
  max_length: 512
  # TensorRT-first uses CUDA/CPU automatically when unavailable.
  prefer_tensorrt: true
  # Do not copy this cache between GPUs or after model/ORT/TensorRT upgrades.
  tensorrt_cache_path: "./data/tensorrt_cache"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  # Reversible latency optimizations; set either false to use the prior path.
  entity_lookup_cache: true
  batched_conflict_resolution: true
  # Candidate pool sizes
  vector_candidates: 100
  graph_hops: 2
  graph_max_nodes: 50
  
  # Contrastive retrieval
  contrastive:
    enabled: true
    ratio: 0.1  # Fraction of candidates from contrastive sampling
    hard_negative_k: 20
  
  # Temporal filtering
  temporal:
    enabled: true
    default_valid_from: null  # null = no lower bound
    default_valid_until: null  # null = no upper bound
    decay_half_life_days: 365  # For importance decay
  
  # Final results
  final_top_k: 10
  
  # Scoring weights (tuned via Optuna in Phase 10)
  weights:
    alpha_semantic: 1.0      # Vector similarity
    beta_graph: 0.8          # Graph connectivity
    gamma_recency: 0.5       # Recency bias
    delta_importance: 0.7    # Explicit importance
    epsilon_entity: 0.4      # Entity overlap
    zeta_relationship: 0.5   # Relationship match
    eta_historical: 0.3      # Historical access
    theta_contradiction: -0.5  # Contradiction penalty (negative)

# =============================================================================
# NVIDIA NIM Extractor (Hosted LLM for extraction)
# =============================================================================
nim:
  base_url: "https://integrate.api.nvidia.com/v1"
  api_key: "${NIM_API_KEY}"  # Set via environment variable
  # Disk cache for raw NIM extraction responses (keyed by model+text hash).
  # Re-runs of graph build / ablation modes never re-hit the API.
  cache_dir: "./data/extraction_cache"
  
  # Models - use currently available models
  extractor_model: "meta/llama-3.2-11b-vision-instruct"
  answerer_model: "meta/llama-3.2-11b-vision-instruct"
  judge_model: "meta/llama-3.2-11b-vision-instruct"
  
  # Generation params
  temperature: 0.1
  max_tokens: 2048
  
  # Extraction prompts
  entity_extraction_prompt: |
    Extract entities from the text. Return JSON with:
    {"entities": [{"name": "...", "type": "PERSON|ORG|LOC|CONCEPT|EVENT|...", "description": "..."}]}
  
  relationship_extraction_prompt: |
    Extract relationships between entities. Return JSON with:
    {"relationships": [{"source": "...", "target": "...", "type": "...", "description": "..."}]}
  
  observation_extraction_prompt: |
    Extract factual observations. Return JSON with:
    {"observations": [{"content": "...", "entities": [...], "confidence": 0.9}]}

# =============================================================================
# Maintenance Configuration
# =============================================================================
maintenance:
  # Decay
  decay:
    enabled: true
    interval_hours: 24
    half_life_days: 365
    min_importance: 0.01
  
  # Deduplication
  deduplication:
    enabled: true
    interval_hours: 168  # Weekly
    similarity_threshold: 0.95
    method: "dbscan"  # "dbscan" | "hdbscan"
    min_cluster_size: 2
  
  # Consolidation
  consolidation:
    enabled: true
    interval_hours: 720  # Monthly
    batch_size: 100
    model: "meta/llama-3.1-70b-instruct"  # Via NIM
    min_observations: 5

# =============================================================================
# LangSmith Observability
# =============================================================================
langsmith:
  enabled: true
  api_key: "${LANGSMITH_API_KEY}"  # Set via environment variable
  project: "hybrid-memory"
  endpoint: "https://api.smith.langchain.com"
  
  # Tracing
  trace_ingestion: true
  trace_retrieval: true
  trace_maintenance: true
  
  # Evaluators
  evaluators:
    - "faithfulness"
    - "relevance"
    - "hallucination"
    - "latency"

# =============================================================================
# Evaluation Benchmarks
# =============================================================================
evaluation:
  datasets_dir: "./data/benchmarks"
  
  dmr:
    enabled: true
    path: "dmr/dmr.json"
  
  locomo:
    enabled: true
    path: "locomo/locomo.json"
  
  longmemeval:
    enabled: true
    path: "longmemeval/longmemeval.json"
    # GPU recommended for this benchmark
    use_gpu_for_ingestion: true

# =============================================================================
# Logging
# =============================================================================
logging:
  level: "INFO"
  format: "json"
  file: "./logs/memory.log"
  max_size_mb: 100
  backup_count: 5
