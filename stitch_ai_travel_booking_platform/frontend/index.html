<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5ef" />
    <title>Voyara — Find your somewhere</title>
    <meta name="description" content="Discover thoughtful stays, local food and journeys with Voyara. Request-first trip planning for stays, food, transport and local guides across India." />
    <meta name="robots" content="INDEX, FOLLOW" />
    <meta property="og:site_name" content="Voyara" />
    <meta property="og:title" content="Voyara — Find your somewhere" />
    <meta property="og:description" content="Thoughtful stays, local food, scenic routes and guides — planned in one place." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Voyara — Find your somewhere" />
    <meta name="twitter:description" content="Request-first trip planning for stays, food, transport and local guides." />
    <meta name="ai-content" content="summary, featured-snippet, conversational-faq, how-to" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Voyara",
        "url": "/",
        "description": "Request-first trip planning for stays, food, transport and local guides across India.",
        "areaServed": "IN"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Voyara",
        "url": "/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": { "@type": "EntryPoint", "urlTemplate": "/destinations?q={search_term_string}" },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
