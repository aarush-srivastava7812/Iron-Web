services:
  - type: web
    name: voyara-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: off
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DEV_LOGIN_ENABLED
        value: "false"
      - key: JUDGE_DEMO_ENABLED
        value: "true"
      - key: JUDGE_DEMO_ORIGINS
        value: https://voyara-travel-taupe.vercel.app
      - key: CONTEXT_USE_GPU
        value: "false"
      - key: USE_GPU
        value: "false"
      - key: VOYARA_AGENT_MODE
        value: tinyfish
      - key: TINYFISH_API_KEY
        sync: false
      - key: TINYFISH_TIMEOUT_S
        value: "480"
      - key: EMBEDDING_THREADS
        value: "1"
      - key: CORS_ORIGINS
        value: https://voyara-travel-taupe.vercel.app
    buildFilter:
      paths:
        - Dockerfile
        - Dockerfile.dockerignore
        - deploy/voyara/**
        - memory/**
        - Iron_Web_2/memory/**
        - agents/**
        - requirements/**
        - requirements.txt
        - config.yaml
        - stitch_ai_travel_booking_platform/backend/**
        - stitch_ai_travel_booking_platform/transitions/**
